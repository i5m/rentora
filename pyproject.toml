[project]
name = "rentora-mcp"
version = "0.1.0"
description = "A Python MCP server that sums letter values (A=1..Z=26) for a given name, hosted on Cloudflare Workers."
requires-python = "==3.12.*"
dependencies = ["mcp", "structlog"]

[dependency-groups]
dev = ["workers-py", "pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    ".venv-workers",
    "node_modules",
    "python_modules",
    ".wrangler",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
